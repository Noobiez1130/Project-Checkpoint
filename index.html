<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Item Form</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

</head>

<body>

    <header class="hero ps-3 py-3 mb-4 ">
            <a href="index.html" class="text-decoration-none text-white">
                <h1 style="margin-bottom: 1px;">Personal Learning Portfolio</h1>
            </a>
             <p class="mb-0 opacity-75">รวบรวมผลงานและการเรียนรู้ของคุณไว้ในที่เดียว</p>
        </header>

    <!-- ส่วนสลับและเพิ่ม Portfolio -->
    
        <div>
            <label for="portfolio-select"><strong>เลือก Profile ที่ต้องการ :</strong></label>
            <select id="portfolio-select">
                <!-- รายการ Portfolio จะมาใส่ตรงนี้ด้วยแบบออโต้ :)) -->
            </select>


            <!-- ช่องกรอกชื่อและปุ่มเพิ่ม/ลบ Portfolio -->
            <div>
                <input type="text" id="new-portfolio-name" placeholder="Profile Name">
                <button type="button" id="add-portfolio-btn">Add Profile</button>
                <button type="button" id="delete-portfolio-btn" style="color: red;">Delete this Profile</button>
            </div>
        </div>
        <hr>
        <h2>Add Portfolio Item</h2>
        <!-- ฟอร์มกรอกข้อมูล -->
        <form id="item-form">
            <!-- id -->
            <div>
                <label for="item-id">ID:</label>
                <input type="text" id="item-id" name="id" placeholder="(ชื่อข้อมูล)" required>
            </div>
            <!-- title -->
            <div>
                <label for="item-title">Title:</label>
                <input type="text" id="item-title" name="title" required>
            </div>
            <!-- type -->
            <div>
                <label for="item-type">Type:</label>
                <input type="text" id="item-type" name="type" required>
            </div>
            <!-- date -->
            <div>
                <label for="item-date">Date:</label>
                <input type="date" id="item-date" name="date" required>
            </div>
            <!-- role -->
            <div>
                <label for="item-role">Role:</label>
                <input type="text" id="item-role" name="role" required>
            </div>
            <!-- description -->
            <div>
                <label for="item-description">Description:</label>
                <textarea id="item-description" name="description" rows="3" required></textarea>
            </div>
            <!-- skills -->
            <div>
                <label for="item-skills">Skills:</label>
                <input type="text" id="item-skills" name="skills" placeholder="ให้คั่นด้วย(,) เช่น HTML, CSS" required>
            </div>
            <!-- reflection -->
            <fieldset>
                <legend>Reflection</legend>
                <div>
                    <label for="item-what-did">What I Did:</label>
                    <input type="text" id="item-what-did" name="whatIDid" required>
                </div>
                <div>
                    <label for="item-what-learned">What I Learned:</label>
                    <input type="text" id="item-what-learned" name="whatILearned" required>
                </div>
                <div>
                    <label for="item-challenge">Challenge:</label>
                    <input type="text" id="item-challenge" name="challenge" required>
                </div>
                <div>
                    <label for="item-next-step">Next Step:</label>
                    <input type="text" id="item-next-step" name="nextStep" required>
                </div>
            </fieldset>
            <!-- evidence -->
            <div>
                <label for="item-evidence">Evidence URL:</label>
                <input type="url" id="item-evidence" name="evidence" placeholder="https://example.com" required>
            </div>
            <br>
            <button type="submit">Save Item</button>
        </form>
        <hr>
        <!-- ส่วนแสดงรายการที่ถูกบันทึก -->
        <h2>Portfolio Items List</h2>
        <div id="items-container">
            <!-- ข้อมูลจะโดนดึงมาตรงนี่นาจา -->
        </div>
   

    <script src="js/app.js"></script>
</body>

</html>
