<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Checkpoint</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="hero">
        <div class="container p-3">
                <h1>Personal Learning Portfolio</h1>
            <p class="mb-0">รวบรวมผลงานและการเรียนรู้ของคุณไว้ในที่เดียว</p>
        </div>
    </header>

    <main class="container position-relative mt-3 pb-4">

        <!-- ส่วนสลับและเพิ่ม Portfolio -->
        <section class="card app-card mb-4">
            <div class="card-body p-4">
                <h2 class="section-title"><i class="bi bi-person-badge"></i> Profile</h2>

                <div class="row g-3 align-items-end">
                    <div class="col-lg-4">
                        <label for="portfolio-select" class="form-label">เลือก Profile ที่ต้องการ</label>
                        <select id="portfolio-select" class="form-select">
                            <!-- รายการ Portfolio จะมาใส่ตรงนี้ด้วยแบบออโต้ :)) -->
                        </select>
                    </div>

                    <!-- ช่องกรอกชื่อและปุ่มเพิ่ม/ลบ Portfolio -->
                    <div class="col-lg-8">
                        <label for="new-portfolio-name" class="form-label">เพิ่ม Profile ใหม่ หรือลบ Profile ที่เลือก</label>
                        <div class="d-flex flex-wrap gap-2">
                            <input type="text" id="new-portfolio-name" class="form-control flex-grow-1 w-auto" placeholder="Profile Name">
                            <button type="button" id="add-portfolio-btn" class="btn btn-brand">
                                <i class="bi bi-plus-lg"></i> Add Profile
                            </button>
                            <button type="button" id="delete-portfolio-btn" class="btn btn-outline-danger">
                                <i class="bi bi-trash3"></i> Delete this Profile
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ฟอร์มกรอกข้อมูล -->
        <section class="card app-card mb-4">
            <div class="card-body p-4">
                <h2 class="section-title"><i class="bi bi-journal-plus"></i> Add Portfolio Item</h2>

                <form id="item-form">
                    <div class="row g-3">
                        <!-- id -->
                        <div class="col-md-6">
                            <label for="item-id" class="form-label">ID</label>
                            <input type="text" id="item-id" name="id" class="form-control" placeholder="(ชื่อข้อมูล)" required>
                        </div>
                        <!-- title -->
                        <div class="col-md-6">
                            <label for="item-title" class="form-label">Title</label>
                            <input type="text" id="item-title" name="title" class="form-control" required>
                        </div>
                        <!-- type -->
                        <div class="col-md-4">
                            <label for="item-type" class="form-label">Type</label>
                            <input type="text" id="item-type" name="type" class="form-control" required>
                        </div>
                        <!-- date -->
                        <div class="col-md-4">
                            <label for="item-date" class="form-label">Date</label>
                            <input type="date" id="item-date" name="date" class="form-control" required>
                        </div>
                        <!-- role -->
                        <div class="col-md-4">
                            <label for="item-role" class="form-label">Role</label>
                            <input type="text" id="item-role" name="role" class="form-control" required>
                        </div>
                        <!-- description -->
                        <div class="col-12">
                            <label for="item-description" class="form-label">Description</label>
                            <textarea id="item-description" name="description" class="form-control" rows="3" required></textarea>
                        </div>
                        <!-- skills -->
                        <div class="col-12">
                            <label for="item-skills" class="form-label">Skills</label>
                            <input type="text" id="item-skills" name="skills" class="form-control" placeholder="ให้คั่นด้วย(,) เช่น HTML, CSS" required>
                        </div>
                        <!-- reflection -->
                        <div class="col-12">
                            <fieldset class="reflection-box">
                                <legend>Reflection</legend>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="item-what-did" class="form-label">What I Did</label>
                                        <input type="text" id="item-what-did" name="whatIDid" class="form-control" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="item-what-learned" class="form-label">What I Learned</label>
                                        <input type="text" id="item-what-learned" name="whatILearned" class="form-control" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="item-challenge" class="form-label">Challenge</label>
                                        <input type="text" id="item-challenge" name="challenge" class="form-control" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="item-next-step" class="form-label">Next Step</label>
                                        <input type="text" id="item-next-step" name="nextStep" class="form-control" required>
                                    </div>
                                </div>
                            </fieldset>
                        </div>
                        <!-- evidence -->
                        <div class="col-12">
                            <label for="item-evidence" class="form-label">Evidence URL</label>
                            <input type="url" id="item-evidence" name="evidence" class="form-control" placeholder="https://example.com" required>
                        </div>
                        <div class="col-12 d-flex justify-content-end">
                            <button type="submit" class="btn btn-dark btn-lg px-4">
                                <i class="bi bi-check2-circle"></i> Save Item
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </section>

        <!-- ส่วนแสดงรายการที่ถูกบันทึก -->
        <section>
            <h2 class="section-title mt-4"><i class="bi bi-collection"></i> Portfolio Items List</h2>
            <div id="items-container" class="row g-3">
                <!-- ข้อมูลจะโดนดึงมาตรงนี่นาจา -->
            </div>
        </section>

    </main>

    <footer class="site-footer">
        Personal Learning Portfolio
    </footer>

    <script src="js/app.js"></script>
</body>

</html>
